        }));

        // ==================== EXTRAÇÃO DE METADADOS ====================
        function extractMetadata(videoUrl) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.crossOrigin = "Anonymous";
                video.muted = true;
                video.preload = "metadata";
                video.currentTime = 0.1;

                const cleanup = () => {
                    video.removeEventListener('loadeddata', onLoad);
                    video.removeEventListener('error', onError);
                    video.src = '';
                    video.load();
                };

                function onLoad() {
                    setTimeout(() => {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            canvas.toBlob(blob => {
                                const thumb = URL.createObjectURL(blob);
                                const duration = video.duration ? formatDuration(video.duration) : '--:--';
                                resolve({ thumbnail: thumb, duration });
                                cleanup();
                            }, 'image/jpeg', 0.8);
                        } catch (e) {
                            resolve({ thumbnail: null, duration: '--:--' });
                            cleanup();
                        }
                    }, 100);
                }

                function onError() {
                    resolve({ thumbnail: null, duration: '--:--' });
                    cleanup();
                }

                video.addEventListener('loadeddata', onLoad);
                video.addEventListener('error', onError);
                video.src = videoUrl;
                video.load();
            });
        }

        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        async function generateAllThumbnails() {
            const promises = fullVideos.map(video => extractMetadata(video.videoUrl));
            const results = await Promise.all(promises);
            videos = fullVideos.map((v, i) => ({
                ...v,
                thumbnail: results[i].thumbnail,
                duration: results[i].duration
            }));
            renderGrid();
        }

        // ==================== RENDERIZAÇÃO ====================
        function renderPlaceholderGrid() {
            const grid = document.getElementById('stories-grid');
            const noResults = document.getElementById('no-results');
            const titleEl = document.getElementById('section-title');
            const countEl = document.getElementById('results-count');

            let filtered = fullVideos;
            if (currentFilter !== 'all') filtered = filtered.filter(v => v.category === currentFilter);
            if (currentSearch.trim()) {
                const q = currentSearch.toLowerCase().trim();
                filtered = filtered.filter(v => v.title.toLowerCase().includes(q));
            }

            const categoryNames = {
                'all': 'Todos os Vídeos',
                'exclusivo': 'Conteúdo Exclusivo',
                'destaque': 'Vídeos em Destaque',
                'novos': 'Novos Vídeos'
            };
            titleEl.textContent = currentSearch.trim()
                ? `Resultados para "${currentSearch}"`
                : categoryNames[currentFilter] || 'Vídeos';
            countEl.textContent = `${filtered.length} vídeo${filtered.length !== 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            grid.innerHTML = filtered.map((video, index) => `
                <div class="story-card reveal" style="animation-delay: ${index * 0.05}s" onclick="openVideo(${video.id})">
                    <div class="loading-thumb w-full" style="aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; background:#1a1a1a;">
                        <i data-lucide="loader-circle" class="w-8 h-8 text-gray-500 animate-spin"></i>
                    </div>
                    <div class="play-overlay"><i data-lucide="play" class="w-5 h-5 text-black fill-black ml-0.5"></i></div>
                    <div class="card-gradient"></div>
                    <div class="card-info">
                        <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold uppercase tracking-wider bg-white/20 text-white">${video.category}</span>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderGrid() {
            if (!videos.length) {
                renderPlaceholderGrid();
                return;
            }

            const grid = document.getElementById('stories-grid');
            const noResults = document.getElementById('no-results');
            const titleEl = document.getElementById('section-title');
            const countEl = document.getElementById('results-count');

            let filtered = videos;
            if (currentFilter !== 'all') filtered = filtered.filter(v => v.category === currentFilter);
            if (currentSearch.trim()) {
                const q = currentSearch.toLowerCase().trim();
                filtered = filtered.filter(v => v.title.toLowerCase().includes(q));
            }

            const categoryNames = {
                'all': 'Todos os Vídeos',
                'exclusivo': 'Conteúdo Exclusivo',
                'destaque': 'Vídeos em Destaque',
                'novos': 'Novos Vídeos'
            };
            titleEl.textContent = currentSearch.trim()
                ? `Resultados para "${currentSearch}"`
                : categoryNames[currentFilter] || 'Vídeos';
            countEl.textContent = `${filtered.length} vídeo${filtered.length !== 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            grid.innerHTML = filtered.map((video, index) => `
                <div class="story-card animated-border reveal" style="animation-delay: ${index * 0.05}s" onclick="openVideo(${video.id})">
                    <img src="${video.thumbnail || ''}" alt="${video.title}" class="card-img" loading="lazy">
                    <div class="play-overlay"><i data-lucide="play" class="w-5 h-5 text-black fill-black ml-0.5"></i></div>
                    <div class="card-gradient"></div>
                    <div class="absolute top-3 left-3 z-10">
                        <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold uppercase tracking-wider bg-white/20 text-white">${video.category}</span>
                    </div>
                    <div class="absolute top-3 right-3 z-10">
                        <span class="px-2 py-0.5 rounded-md text-xs font-medium bg-black/70 border border-white/15 text-white">${video.duration || '...'}</span>
                    </div>
                    <div class="card-info">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="w-5 h-5 rounded-full bg-white/20 flex-shrink-0"></div>
                            <h3 class="font-display font-semibold text-xs leading-snug line-clamp-1 text-white/90">${video.title}</h3>
                        </div>
                        <p class="text-[10px] text-gray-400">${video.views} visualizações • ${video.date}</p>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
            requestAnimationFrame(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
            });
        }

        // ==================== NAVEGAÇÃO ====================
        function openVideo(videoId) {
            const video = videos.find(v => v.id === videoId);
            if (!video) return;

            currentView = 'detail';
            window.scrollTo({ top: 0, behavior: 'instant' });

            document.getElementById('grid-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            document.getElementById('main-footer').classList.add('hidden');

            const detailView = document.getElementById('detail-view');
            detailView.innerHTML = `
                <div class="detail-page px-4 sm:px-6 lg:px-8 py-6 max-w-6xl mx-auto">
                    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
                        <button onclick="goHome()" class="back-btn px-3 py-2 rounded-xl text-sm">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>Voltar aos vídeos
                        </button>
                        <div class="flex gap-2">
                            <button onclick="handleLike(this)" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all text-sm" data-liked="false">
                                <i data-lucide="heart" class="w-4 h-4"></i>
                                <span>Gostar</span>
                                <span class="text-gray-500 count">0</span>
                            </button>
                            <button onclick="shareVideo('${video.videoUrl}')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all text-sm">
                                <i data-lucide="share-2" class="w-4 h-4"></i>Partilhar
                            </button>
                            <button onclick="showToast('Adicionado aos favoritos! ⭐')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all text-sm">
                                <i data-lucide="bookmark" class="w-4 h-4"></i>Guardar
                            </button>
                        </div>
                    </div>

                    <div class="video-wrapper mb-6">
                        <div class="video-container">
                            <video id="mainVideo" controls controlsList="nodownload" oncontextmenu="return false;" autoplay poster="${video.thumbnail || ''}" preload="auto">
                                <source src="${video.videoUrl}" type="video/mp4">
                                Seu navegador não suporta vídeo.
                            </video>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2">
                            <div class="flex flex-wrap items-center gap-3 mb-3">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-white/10 border border-white/10 text-gray-300">${video.category}</span>
                                <span class="text-xs text-gray-500 flex items-center gap-1"><i data-lucide="eye" class="w-3.5 h-3.5"></i>${video.views} visualizações</span>
                                <span class="text-xs text-gray-500">•</span>
                                <span class="text-xs text-gray-500">${video.date}</span>
                            </div>

                            <h1 class="font-display text-2xl sm:text-3xl lg:text-4xl font-bold leading-tight mb-6">${video.title}</h1>

                            <div class="flex items-center gap-4 mb-6 p-4 rounded-2xl bg-white/5 border border-white/10">
                                <div class="profile-ring flex-shrink-0">
                                    <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-lg font-bold">V</div>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-display font-semibold text-base">vazamets Oficial</h3>
                                    <p class="text-sm text-gray-500">Canal oficial • ${video.views} visualizações</p>
                                </div>
                                <button onclick="showToast('Agora segues o canal! ✨')" class="px-5 py-2 rounded-xl bg-white text-black text-sm font-medium hover:bg-gray-200 transition-colors flex-shrink-0">
                                    Seguir
                                </button>
                            </div>

                            <div class="mb-8">
                                <p class="text-gray-300 text-sm sm:text-base leading-relaxed">${video.description || 'Vídeo exclusivo da plataforma vazamets. Desfrute em HD com controlo total.'}</p>
                            </div>
                        </div>

                        <div class="lg:col-span-1">
                            <div class="p-5 rounded-2xl bg-white/5 border border-white/10 sticky top-24">
                                <h4 class="font-display font-semibold text-sm mb-4 flex items-center gap-2">
                                    <i data-lucide="info" class="w-4 h-4 text-gray-400"></i>
                                    Informações
                                </h4>
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between text-sm">
                                        <span class="text-gray-500">Duração</span>
                                        <span class="text-white font-medium">${video.duration || '--:--'}</span>
                                    </div>
                                    <div class="flex items-center justify-between text-sm">
                                        <span class="text-gray-500">Visualizações</span>
                                        <span class="text-white font-medium">${video.views}</span>
                                    </div>
                                    <div class="flex items-center justify-between text-sm">
                                        <span class="text-gray-500">Categoria</span>
                                        <span class="px-2 py-0.5 rounded-md bg-white/10 text-gray-300 text-xs font-medium capitalize">${video.category}</span>
                                    </div>
                                    <div class="flex items-center justify-between text-sm">
                                        <span class="text-gray-500">Publicado</span>
                                        <span class="text-white font-medium">${video.date}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 pt-8 border-t border-white/10">
                        <h3 class="font-display font-semibold text-lg mb-6 flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-5 h-5 text-gray-400"></i>
                            Vídeos Relacionados
                        </h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                            ${getRelatedVideos(video).map(v => `
                                <div class="story-card rounded-xl cursor-pointer" onclick="openVideo(${v.id})">
                                    <img src="${v.thumbnail || ''}" alt="${v.title}" class="card-img">
                                    <div class="play-overlay" style="width:36px;height:36px;"><i data-lucide="play" class="w-4 h-4 text-black fill-black ml-0.5"></i></div>
                                    <div class="card-gradient"></div>
                                    <div class="absolute top-2 left-2 z-10">
                                        <span class="px-1.5 py-0.5 rounded text-[9px] font-semibold uppercase bg-white/20 text-white">${v.category}</span>
                                    </div>
                                    <div class="absolute top-2 right-2 z-10">
                                        <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-black/70 border border-white/15 text-white">${v.duration || '...'}</span>
                                    </div>
                                    <div class="card-info">
                                        <h4 class="text-xs font-medium line-clamp-2">${v.title}</h4>
                                        <p class="text-[10px] text-gray-400 mt-0.5">${v.views} visualizações</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            lucide.createIcons();

            const videoElem = document.getElementById('mainVideo');
            if (videoElem) {
                currentVideo = videoElem;
                videoElem.load();
            }
        }

        function getRelatedVideos(currentVideo) {
            return videos
                .filter(v => v.id !== currentVideo.id)
                .sort(() => 0.5 - Math.random())
                .slice(0, 8);
        }

        function goHome() {
            if (currentVideo) currentVideo.pause();
            currentView = 'grid';
            document.getElementById('grid-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('main-footer').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== INTERAÇÕES ====================
        function handleLike(btn) {
            const countEl = btn.querySelector('.count');
            let count = parseInt(countEl.textContent);
            const isLiked = btn.dataset.liked === 'true';

            if (isLiked) {
                count--;
                btn.dataset.liked = 'false';
                btn.classList.remove('bg-white/15', 'border-white/20');
                btn.classList.add('bg-white/5');
                showToast('Removeste o teu like');
            } else {
                count++;
                btn.dataset.liked = 'true';
                btn.classList.add('bg-white/15', 'border-white/20');
                btn.classList.remove('bg-white/5');
                showToast('Gostaste deste vídeo! ❤️');
            }
            countEl.textContent = count;
        }

        function shareVideo(url) {
            if (navigator.share) {
                navigator.share({ title: 'vazamets', url: url });
            } else {
                navigator.clipboard.writeText(url);
                showToast('Link copiado! 🔗');
            }
        }

        function handleSearch(query) {
            currentSearch = query;
            const di = document.getElementById('search-input');
            const mi = document.getElementById('mobile-search-input');
            if (di && document.activeElement !== di) di.value = query;
            if (mi && document.activeElement !== mi) mi.value = query;
            document.getElementById('search-clear').classList.toggle('hidden', !query.trim());
            if (currentView === 'detail') goHome();
            renderGrid();
        }

        function clearSearch() {
            currentSearch = '';
            document.getElementById('search-input').value = '';
            document.getElementById('mobile-search-input').value = '';
            document.getElementById('search-clear').classList.add('hidden');
            if (currentView === 'detail') goHome();
            renderGrid();
        }

        function filterCategory(category, btn) {
            currentFilter = category;
            document.querySelectorAll('#category-filters .tag-pill').forEach(b => {
                b.classList.remove('active', 'text-white');
                b.classList.add('text-gray-400');
            });
            btn.classList.add('active', 'text-white');
            btn.classList.remove('text-gray-400');
            if (currentView === 'detail') goHome();
            renderGrid();
        }

        function toggleMobileSearch() {
            const el = document.getElementById('mobile-search');
            if (el.style.maxHeight && el.style.maxHeight !== '0px') {
                el.style.maxHeight = '0px';
            } else {
                el.style.maxHeight = '80px';
                el.querySelector('input').focus();
            }
        }

        function showToast(message) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast px-4 py-3 rounded-xl bg-white/10 backdrop-blur-xl border border-white/10 text-sm font-medium text-white shadow-2xl max-w-xs';
            t.textContent = message;
            c.appendChild(t);
            setTimeout(() => {
                t.classList.add('toast-out');
                setTimeout(() => t.remove(), 300);
            }, 2500);
        }

        function initParticles() {
            const container = document.getElementById('particles');
            const count = window.innerWidth < 768 ? 15 : 30;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.width = (Math.random() * 2 + 1) + 'px';
                p.style.height = p.style.width;
                p.style.opacity = Math.random() * 0.2 + 0.05;
                p.style.animation = `bgPulse ${Math.random() * 10 + 10}s ease-in-out infinite alternate`;
                p.style.animationDelay = `-${Math.random() * 10}s`;
                container.appendChild(p);
            }
        }

        function initHeaderScroll() {
            const header = document.getElementById('main-header');
            window.addEventListener('scroll', () => {
                if (window.pageYOffset > 50) {
                    header.style.background = 'rgba(0,0,0,0.95)';
                    header.style.backdropFilter = 'blur(20px)';
                } else {
                    header.style.background = 'rgba(0,0,0,0.8)';
                    header.style.backdropFilter = 'blur(20px)';
                }
            }, { passive: true });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPlaceholderGrid();
            lucide.createIcons();
            initParticles();
            initHeaderScroll();
            generateAllThumbnails();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && currentView === 'detail') {
                goHome();
            }
        });
    </script>
</body>
</html>
